# ---- Clipboard -------------------------------------------------------------
# Let tmux forward OSC 52 to the outer terminal, so copy-mode yanks (and
# anything nvim sends over SSH) reach the desktop clipboard.
set -g set-clipboard on

# ---- Terminal --------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"   # true colour for nvim

set -sg escape-time 10        # don't make <Esc> feel laggy in nvim
set -g focus-events on        # nvim autoread / FocusGained
set -g history-limit 50000

# ---- Windows and panes -----------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on

# ---- Copy mode (vi keys) ---------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# ---- Misc ------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

